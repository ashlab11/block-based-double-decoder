# ─────────────────────────────────────────────────────────────────────────────
# 15M Double Decoder — Pretrain on 50M tokens of SlimPajama
# ─────────────────────────────────────────────────────────────────────────────
#
# Estimated: ~15.3M params (dim=256, enc=6, dec=3)
# Data: 50M tokens from SlimPajama, packed to seq_len=2048
# Total steps: ~50M / (64 * 2 * 2048) ≈ 190 accumulation steps
#
# Usage:
#   torchrun --nproc_per_node=1 training/pretrain.py
#

# ── Model ────────────────────────────────────────────────────────────────────
model_cls: "Double_Decoder"
dim: 256
num_encoder_layers: 6
num_decoder_layers: 3
seq_len: 2048
shared: true
logit_biases: false
init_strategy: "xavier_uniform"

# ── Data ─────────────────────────────────────────────────────────────────────
collator_cls: "BasicPretrainCollator"
train_file: "data/Pretrain/slimpajama_packed.jsonl"
eval_file: "data/Pretrain/slimpajama_eval_packed.jsonl"
tokenizer_file: "tokenizer/tokenizer.json"

# ── Training ─────────────────────────────────────────────────────────────────
batch_size: 64
grad_accum_steps: 2
lr: 6e-4
end_lr_ratio: 0.1

# ── Logging & checkpoints ───────────────────────────────────────────────────
logging_steps: 100
eval_steps: 500
save_steps: 2000
output_dir: "checkpoints"
output_file_name: "dd_15m_50mtok"
