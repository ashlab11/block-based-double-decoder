# ─────────────────────────────────────────────────────────────────────────────
# 1B Double Decoder — Pretrain on 20B tokens of SlimPajama (Chinchilla-optimal)
# ─────────────────────────────────────────────────────────────────────────────
#
# Estimated: ~1.07B params (dim=1536, enc=24, dec=12)
# Data: 20B tokens from SlimPajama-627B, packed to seq_len=2048
# Hardware: 4x H100
# Effective batch: 16 * 4 * 4 GPUs = 256 seqs = ~524K tokens/step
# Total steps: 20B / 524K ≈ 38,168 accumulation steps
#
# Usage:
#   torchrun --nproc_per_node=4 training/pretrain.py --config-name=runs/pretrain_1b
#

# ── Model ────────────────────────────────────────────────────────────────────
model_cls: "Double_Decoder"
dim: 1536
num_encoder_layers: 24
num_decoder_layers: 12
seq_len: 2048
shared: true
logit_biases: false
init_strategy: "xavier_uniform"
gradient_checkpointing: true

# ── Data ─────────────────────────────────────────────────────────────────────
collator_cls: "BasicPretrainCollator"
train_file: "data/Pretrain/slimpajama_20b_packed.jsonl"
eval_file: "data/Pretrain/slimpajama_20b_eval_packed.jsonl"
tokenizer_file: "tokenizer/tokenizer_32k.json"

# ── Training ─────────────────────────────────────────────────────────────────
batch_size: 16
grad_accum_steps: 4
lr: 3e-4
end_lr_ratio: 0.1
total_tokens: 20000000000

# ── Logging & checkpoints ───────────────────────────────────────────────────
logging_steps: 100
eval_steps: 2000
save_steps: 5000
output_dir: "checkpoints"
output_file_name: "dd_1b_20btok"

# ── Wandb ────────────────────────────────────────────────────────────────────
wandb_project: "block-based-double-decoder"
wandb_run_name: "dd_1b_20btok"
wandb_entity: "benjamin_bradley"
