# ─────────────────────────────────────────────────────────────────────────────
# 300M Double Decoder — Pretrain on 6B tokens of SlimPajama (Chinchilla-optimal)
# ─────────────────────────────────────────────────────────────────────────────
#
# Estimated: ~335M params (dim=1024, enc=16, dec=8)
# Data: ~4B tokens from DKYoon/SlimPajama-6B, packed to seq_len=2048
# Hardware: 1x H100
# Effective batch: 16 * 16 * 1 GPU = 256 seqs = ~524K tokens/step
# Total steps: 4B / 524K ≈ 7,629 accumulation steps
#
# Usage:
#   torchrun --nproc_per_node=1 training/pretrain.py --config-name=runs/pretrain_300m
#

# ── Model ────────────────────────────────────────────────────────────────────
model_cls: "Double_Decoder"
dim: 1024
num_encoder_layers: 16
num_decoder_layers: 8
seq_len: 2048
shared: true
logit_biases: false
init_strategy: "xavier_uniform"
gradient_checkpointing: false

# ── Data ─────────────────────────────────────────────────────────────────────
collator_cls: "DDPretrainCollator"
train_file: "data/Pretrain/slimpajama_6b_packed.jsonl"
eval_file: "data/Pretrain/slimpajama_6b_eval_packed.jsonl"
tokenizer_file: "tokenizer/tokenizer_32k.json"

# ── Training ─────────────────────────────────────────────────────────────────
batch_size: 16
grad_accum_steps: 16
lr: 3e-4
end_lr_ratio: 0.1
total_tokens: 4000000000

# ── Logging & checkpoints ───────────────────────────────────────────────────
logging_steps: 160
eval_steps: 16000
save_steps: 8000
output_dir: "checkpoints"
output_file_name: "dd_300m_6btok"

# ── Wandb ────────────────────────────────────────────────────────────────────
wandb_project: "block-based-double-decoder"
wandb_run_name: "dd_300m_6btok"
wandb_entity: "block-based-double-decoders"
